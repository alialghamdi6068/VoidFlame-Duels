    - {id: clutch, name: "[Clutch]", price: 1200, material: TOTEM_OF_UNDYING, color: "&6"}
    - {id: warlord, name: "[Warlord]", price: 1500, material: NETHERITE_SWORD, color: "&c"}
    - {id: unbreakable, name: "[Unbreakable]", price: 1750, material: NETHERITE_CHESTPLATE, color: "&5"}
    - {id: speedster, name: "[Speedster]", price: 2000, material: FEATHER, color: "&b"}
    - {id: striker, name: "[Striker]", price: 2250, material: ARROW, color: "&f"}
    - {id: swordsman, name: "[Swordsman]", price: 2500, material: DIAMOND_SWORD, color: "&3"}
    - {id: axemaster, name: "[AxeMaster]", price: 2750, material: DIAMOND_AXE, color: "&6"}
    - {id: crystal, name: "[Crystal]", price: 3000, material: END_CRYSTAL, color: "&d"}
    - {id: mace, name: "[Mace]", price: 3250, material: MACE, color: "&5"}
    - {id: spear, name: "[Spear]", price: 3500, material: SPEAR, color: "&a"}
