# ================================================================
# Presentation & gameplay extensions
# ================================================================
# Main queue GUI is intentionally 3 rows (27 slots), matching the compact practice layout.
#
# Advanced Duels features
welcome:
  title: "&b&lVOIDFLAME"
  subtitle: "&fWelcome &e<player>&f."
  join-message: "&bVoidFlame &7» &fWelcome &e<player>&f."

death-messages:
  default: "&c<victim> was eliminated."
  player-kill: "&c<victim> &7was defeated by &a<killer>&7."

autogg:
  enabled: true
  delay-ticks: 10
  message: "gg"

report:
  cooldown-seconds: 20
  staff-message: "&c[Report] &f<reporter> &7reported &e<target> &7for: &f<reason>"

rewards:
  duel:
    win:
      enabled: true
      coins: 50
      message: "&a+<coins> coins for winning the duel."
    loss:
      enabled: true
      coins: 10
      message: "&7+<coins> coins for completing the duel."
    draw:
      enabled: true
      coins: 20
      message: "&e+<coins> coins for the draw."
  ffa:
    kill:
      enabled: true
      coins: 5
      message: "&a+<coins> coins for an FFA elimination."
  party:
    win:
      enabled: true
      coins: 75
      message: "&a+<coins> coins for winning the party match."
    loss:
      enabled: true
      coins: 15
      message: "&7+<coins> coins for completing the party match."
    draw:
      enabled: true
      coins: 25
      message: "&e+<coins> coins for the party draw."

announcements:
  enabled: true
  interval-seconds: 90
  messages:
    - "&bVoidFlame &7» &fUse &e/duels &fto find a match."
    - "&bVoidFlame &7» &fReport suspicious players with &e/report <player> <reason>&f."
    - "&bVoidFlame &7» &fPractice, improve and compete."

duel-menu:
  right-click-enabled: true

trim-editor:
  enabled: true

chat-rate-limit:
  enabled: true
  minimum-interval-ms: 750

# إعدادات التدريب
training:
  duration-seconds: 30

features:
  ffa:
    enabled: true
    world: ffa
    max-players: 32
    reset-interval-minutes: 60
  rounds:
    enabled: true
    default-rounds: 1
  offhand:
    enabled: true
  replay:
    enabled: true
    max-events-per-match: 2000
  goldenhard:
    enabled: true
  party-stats:
    enabled: true
  exploit-prevention:
    enabled: true
    inventory-clicks: true
    inventory-drags: true
    item-drop: true
    item-pickup: true
    hand-swap: false

# متجر العملات — جميع المنتجات والأسعار قابلة للتعديل من هنا.
shop:
  products:
    - {id: void, name: "[Void]", price: 100, material: NAME_TAG, color: "&b"}
    - {id: champion, name: "[Champion]", price: 500, material: NETHER_STAR, color: "&d"}
    - {id: duelist, name: "[Duelist]", price: 750, material: DIAMOND_SWORD, color: "&a"}
