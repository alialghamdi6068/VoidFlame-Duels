arenas:
  auto-discover-worlds: true
  list: []
  # Example:
  # - name: Arena-1
  #   world: duels
  #   spawn-a: {x: 0.5, y: 100, z: 0.5, yaw: 90, pitch: 0}
  #   spawn-b: {x: 20.5, y: 100, z: 0.5, yaw: -90, pitch: 0}

# ================================================================
# Presentation & gameplay extensions
# ================================================================
# GUI is intentionally 6 rows (54 slots), matching the modern practice
# server layout. Kit positions/icons remain fully configurable below.
#
# Advanced Duels features
welcome:
  title: "&b&lVOIDFLAME"
  subtitle: "&fWelcome &e<player>&f."
  join-message: "&bVoidFlame &7» &fWelcome &e<player>&f."

death-messages:
  default: "&c<victim> was eliminated."
  player-kill: "&c<victim> &7was defeated by &a<killer>&7."

autogg:
  enabled: true
  delay-ticks: 10
  message: "gg"

report:
  cooldown-seconds: 20
  staff-message: "&c[Report] &f<reporter> &7reported &e<target> &7for: &f<reason>"

rewards:
  duel:
    win:
      enabled: true
      coins: 50
      message: "&a+<coins> coins for winning the duel."
    loss:
      enabled: true
      coins: 10
      message: "&7+<coins> coins for completing the duel."
    draw:
      enabled: true
      coins: 20
      message: "&e+<coins> coins for the draw."
  ffa:
    kill:
      enabled: true
      coins: 5
      message: "&a+<coins> coins for an FFA elimination."
  party:
    win:
      enabled: true
      coins: 75
      message: "&a+<coins> coins for winning the party match."
    loss:
      enabled: true
      coins: 15
      message: "&7+<coins> coins for completing the party match."
    draw:
      enabled: true
      coins: 25
      message: "&e+<coins> coins for the party draw."

announcements:
  enabled: true
  interval-seconds: 90
  messages:
    - "&bVoidFlame &7» &fUse &e/duels &fto find a match."
    - "&bVoidFlame &7» &fReport suspicious players with &e/report <player> <reason>&f."
    - "&bVoidFlame &7» &fPractice, improve and compete."

duel-menu:
  right-click-enabled: true

trim-editor:
  enabled: true

chat-rate-limit:
  enabled: true
  minimum-interval-ms: 750

# إعدادات التدريب
training:
  duration-seconds: 30

features:
  ffa:
    enabled: true
    world: ffa
    max-players: 32
    reset-interval-minutes: 60
  rounds:
    enabled: true
    default-rounds: 1
  offhand:
    enabled: true
  replay:
    enabled: true
    max-events-per-match: 2000
  goldenhard:
    enabled: true
  party-stats:
    enabled: true
  exploit-prevention:
    enabled: true
    inventory-clicks: true
    inventory-drags: true
    item-drop: true
    item-pickup: true
    hand-swap: false

# متجر العملات — جميع المنتجات والأسعار قابلة للتعديل من هنا.
shop:
  products:
    - {id: void, name: "[Void]", price: 100, material: NAME_TAG, color: "&b"}
    - {id: champion, name: "[Champion]", price: 500, material: NETHER_STAR, color: "&d"}
    - {id: duelist, name: "[Duelist]", price: 750, material: DIAMOND_SWORD, color: "&a"}
    - {id: combo, name: "[Combo]", price: 900, material: IRON_SWORD, color: "&e"}
    - {id: clutch, name: "[Clutch]", price: 1200, material: TOTEM_OF_UNDYING, color: "&6"}
    - {id: warlord, name: "[Warlord]", price: 1500, material: NETHERITE_SWORD, color: "&c"}
    - {id: unbreakable, name: "[Unbreakable]", price: 1750, material: NETHERITE_CHESTPLATE, color: "&5"}
    - {id: speedster, name: "[Speedster]", price: 2000, material: FEATHER, color: "&b"}
    - {id: striker, name: "[Striker]", price: 2250, material: ARROW, color: "&f"}
    - {id: swordsman, name: "[Swordsman]", price: 2500, material: DIAMOND_SWORD, color: "&3"}
    - {id: axemaster, name: "[AxeMaster]", price: 2750, material: DIAMOND_AXE, color: "&6"}
    - {id: crystal, name: "[Crystal]", price: 3000, material: END_CRYSTAL, color: "&d"}
    - {id: mace, name: "[Mace]", price: 3250, material: MACE, color: "&5"}
    - {id: spear, name: "[Spear]", price: 3500, material: SPEAR, color: "&a"}
    - {id: voidwalker, name: "[VoidWalker]", price: 4000, material: ENDER_PEARL, color: "&8"}
    - {id: nightmare, name: "[Nightmare]", price: 5000, material: WITHER_SKELETON_SKULL, color: "&8"}
    - {id: legend, name: "[Legend]", price: 7500, material: DRAGON_EGG, color: "&5"}
    - {id: mythic, name: "[Mythic]", price: 10000, material: DRAGON_HEAD, color: "&d"}

combat-tag:
  enabled: true
  duration-seconds: 15
  cleanup-interval-ticks: 20
  quit-counts-as-loss: true
  allowed-commands:
    - msg
    - tell
    - r
    - reply
  blocked-message: "&cYou cannot use that command while combat tagged."

combat:
  command-blocking-enabled: true
  allowed-commands:
    - msg
    - tell
    - r
    - reply
  blocked-message: "&cCommands are disabled while fighting."


queue:
  ranked:
    enabled: true
    default-elo: 1000.0
    initial-elo-range: 100.0
    elo-range-growth-per-second: 10.0
