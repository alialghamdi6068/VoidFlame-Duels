settings:
  language: en
  queue-timeout-seconds: 300
  countdown-seconds: 5
  match-time-limit-seconds: 1800
  disconnect-grace-seconds: 30
  request-expiry-seconds: 60
  prevent-duel-during-match: true

messages:
  prefix: "&8[&bVoidFlame&8] "
  no-permission: "&cYou do not have permission."
  player-not-found: "&cPlayer not found."
  already-queued: "&cYou are already in a queue."
  not-queued: "&cYou are not in a queue."
  joined-queue: "&aJoined the &e<kit> &aqueue."
  left-queue: "&aYou left the queue."
  already-in-match: "&cYou are already in a match."
  duel-sent: "&aDuel request sent to &e<player>&a."
  duel-received: "&e<player> &awants to duel you in &e<kit>&a. Use &f/duel accept <player>&a."
  request-expired: "&cThat duel request expired."
  request-accepted: "&aDuel request accepted."
  duel-starting: "&bDuel starting..."
  fight: "&aFight!"
  match-ended: "&e<winner> &awon the &e<kit> &aduel."
  opponent-left: "&e<opponent> &cleft the duel."
  rejoin-available: "&aYou have &e<seconds>s &ato rejoin your duel with &e<opponent>&a. Use &f/rejoin&a."
  no-rejoin: "&cYou have no duel to rejoin."
  rematch-sent: "&aRematch request sent."
  rematch-received: "&e<player> &awants a rematch. Use &f/rematch accept <player>&a."

gui:
  title: "&8⚔ Join Queue"
  rows: 6
  filler-item: GRAY_STAINED_GLASS_PANE
  kits:
    sword:
      slot: 11
      display-name: "&aSword"
      icon: DIAMOND_SWORD
      lore:
        - "&7Classic sword practice."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."
    axe:
      slot: 13
      display-name: "&aAxe"
      icon: DIAMOND_AXE
      lore:
        - "&7Axe and shield practice."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."
    uhc:
      slot: 15
      display-name: "&aUHC"
      icon: GOLDEN_APPLE
      lore:
        - "&7UHC practice."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."
    mace:
      slot: 29
      display-name: "&aMace"
      icon: MACE
      lore:
        - "&7Elytra mace practice."
        - "&7Includes Breach and Density maces."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."
    spear_mace:
      slot: 31
      display-name: "&aSpear & Mace"
      icon: SPEAR
      lore:
        - "&7Spear pressure with a Density mace."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."
    crystal:
      slot: 33
      display-name: "&aCrystal"
      icon: END_CRYSTAL
      lore:
        - "&7Crystal PvP practice."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."
    netherite_op:
      slot: 35
      display-name: "&aNetherite OP"
      icon: NETHERITE_HELMET
      lore:
        - "&7High-power Netherite practice."
        - "&fQueued: &a<queued_players>"
        - "&fIn Match: &e<in_match_players>"
        - "&eClick to join."

