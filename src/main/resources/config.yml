gui:
  title: "&8VoidFlame &7• &fQueue"
  rows: 6
  filler-item: GRAY_STAINED_GLASS_PANE
  kits:
    sword:
      enabled: true
      slot: 10
      display-name: "&d&lSword"
      icon: DIAMOND_SWORD
    axe:
      enabled: true
      slot: 11
      display-name: "&d&lAxe"
      icon: DIAMOND_AXE
    uhc:
      enabled: true
      slot: 12
      display-name: "&d&lUHC"
      icon: GOLDEN_APPLE
    mace:
      enabled: true
      slot: 13
      display-name: "&d&lMace"
      icon: MACE
    spear_mace:
      enabled: true
      slot: 14
      display-name: "&d&lSpear & Mace"
      icon: SPEAR
    crystal:
      enabled: true
      slot: 15
      display-name: "&d&lCrystal"
      icon: END_CRYSTAL

