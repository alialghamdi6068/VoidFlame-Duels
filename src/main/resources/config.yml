# ================================================================
# VoidFlame Duels • Production Configuration
# Paper 26.2 • Java 25
# ================================================================
# Matchmaking, GUI, rewards, combat, reports, replay and performance.
# Keep all player-facing text and tunables here so gameplay does not
# require source-code edits.

settings:
  language: en
  queue-timeout-seconds: 300
  # Queue timeout keeps stale entries from accumulating.
  countdown-seconds: 5
  match-time-limit-seconds: 1800
  disconnect-grace-seconds: 30
  reconnect-enabled: true
  party-reconnect-enabled: true
  party-reconnect-grace-seconds: 30
  request-expiry-seconds: 60
  prevent-duel-during-match: true
  rematch-expiry-seconds: 120
  party-max-size: 8
  party-invite-expiry-seconds: 60
  party-auto-start: true
  party-min-ffa-size: 2
  party-default-kit: sword
  party-matchmaking-enabled: true
  party-queue-enabled: true
  individual-matchmaking-enabled: true
  arena-acquire-retry-ticks: 20
  countdown-title: "&b&l<seconds>"

