# VoidFlame branded TAB sidebar. Merge this section into plugins/TAB/config.yml.
# Keep TAB as the only scoreboard owner so prefixes and nametag teams remain intact.
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  hidden-by-default: false
  delay-on-join-milliseconds: 500
  scoreboards:
    voidflame-practice:
      title: "<gradient:#7C3AED:#22D3EE><bold>VOIDFLAME</bold></gradient>"
      lines:
        - "&8&m--------------------"
        - "<#A78BFA>◆ &7MODE &8» <#F8FAFC>%voidflame_mode%"
        - "<#A78BFA>◆ &7RANK &8» <#F8FAFC>%voidflame_rank%"
        - "<#A78BFA>◆ &7PLAYER &8» <#F8FAFC>%player%"
        - "&r"
        - "<#22D3EE>✦ &7WINS &8» <#F8FAFC>%voidflame_wins%"
        - "<#F87171>✦ &7LOSSES &8» <#F8FAFC>%voidflame_losses%"
        - "<#22D3EE>✦ &7STREAK &8» <#F8FAFC>%voidflame_streak%"
        - "<#FBBF24>✦ &7ELO &8» <#F8FAFC>%voidflame_elo%"
        - "<#A78BFA>✦ &7COINS &8» <#F8FAFC>%voidflame_coins%"
        - "&r "
        - "&8Online &7» <#F8FAFC>%online%"
        - "<gradient:#7C3AED:#22D3EE>play.VoidFlame.net</gradient>"
